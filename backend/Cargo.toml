[package]
name = "dbx-plugin-excelx"
version = "0.9.7"
edition = "2021"
license = "Apache-2.0"

[workspace]

[dependencies]
dbx-plugin-sdk = "0.1.0"
serde_json = "1"
calamine = "0.30"
zip = "2"
csv = "1.3"
rusqlite = { version = "0.37", features = ["bundled"] }
rust_xlsxwriter = "0.89"
encoding_rs = "0.8"
chrono = "0.4"

# Keep plugin binaries close to the host app's size: default release settings
# leave ~20MB of symbols and unoptimized generic code in an OpenDAL-sized backend.
# panic stays "unwind" so the sidecar protocol can report panics as errors.
[profile.release]
strip = true
lto = true
codegen-units = 1
