name: macOS tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: cargo test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        working-directory: backend
        run: cargo test
      - name: build + handshake smoke
        working-directory: backend
        run: |
          cargo build --release
          echo '{"jsonrpc":"2.0","id":1,"method":"plugin/initialize","params":{"host":{"protocolVersions":[1]}}}' | ./target/release/dbx-plugin-excelx | head -c 200
